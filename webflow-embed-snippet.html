<!-- Paste into a Webflow Code Embed element. Change the src to your GitHub Pages URL + file name. -->
<iframe class="cpy-frame" src="https://stefanheyorange.github.io/cpy-lead-magnets/"
  style="width:100%;height:1200px;border:0;display:block;overflow:hidden" scrolling="no" loading="lazy" title="CorePower interactive concepts"></iframe>
<script>
/* Auto-resizes the iframe to the app's height. Add once per page. */
window.addEventListener('message',function(e){
  if(!e.data||!e.data.cpyFrame||!/github\.io$/.test(new URL(e.origin).hostname))return;
  document.querySelectorAll('iframe.cpy-frame').forEach(function(f){
    if(f.contentWindow===e.source)f.style.height=e.data.height+'px';
  });
});
</script>
