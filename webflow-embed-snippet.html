<iframe class="cpy-frame" src="https://stefanheyorange.github.io/cpy-lead-magnets/1-find-your-class-quiz.html"
  style="width:100%;height:1200px;border:0;display:block;overflow:hidden" scrolling="no" loading="lazy" title="Find Your Class"></iframe>
<script>
window.addEventListener('message',function(e){
  if(!e.data||!e.data.cpyFrame||!/github\.io$/.test(new URL(e.origin).hostname))return;
  document.querySelectorAll('iframe.cpy-frame').forEach(function(f){
    if(f.contentWindow===e.source)f.style.height=e.data.height+'px';
  });
});
</script>
